# Selected projects, shown in the homepage rail. index.qmd loads this file and includes/projects.lua draws the list.
# Curated order; keep this list to four projects.
#   path:        public project destination, or a published (not draft) blog post
#                Published posts also receive atlas/feed hover highlighting.
#   status:      live | wip | released (release maturity, not a real-time health check)
#   links:       text + href; links off the site get ↗, links on it get →
projects:
  - title: Open GovTech Index
    path: https://www.govtechindex.cloud/
    description: Explore government open-source software, with searchable repositories, downloadable data and a public API.
    status: live
    links:
      - text: explore
        href: https://www.govtechindex.cloud/
      - text: data
        href: https://huggingface.co/datasets/AndreasThinks/government-github-repos
      - text: code
        href: https://github.com/AndreasThinks/open-govtech-report
  - title: Broadsheet
    path: https://broadsheet-feeds-production.up.railway.app/
    description: Read and post across Bluesky, Mastodon and X, with local-first storage and feeds you control.
    status: released
    links:
      - text: try in browser
        href: https://broadsheet-feeds-production.up.railway.app/web
      - text: download
        href: https://broadsheet-feeds-production.up.railway.app/
      - text: code
        href: https://github.com/AndreasThinks/cross-poster-
  - title: BotBowl Bench
    path: https://github.com/AndreasThinks/botbowlbench
    description: Language models coach Blood Bowl teams, with recorded games and decision-quality analysis. Built on the BotBowl engine.
    status: wip
    links:
      - text: benchmark
        href: https://github.com/AndreasThinks/botbowlbench/tree/main/bench
      - text: code
        href: https://github.com/AndreasThinks/botbowlbench
  - title: Hermes Wristbound
    path: https://github.com/AndreasThinks/hermes-wristbound
    description: Your own Hermes assistant on a Pebble watch. Experimental release requiring an Android companion and a running Hermes backend.
    status: wip
    links:
      - text: install
        href: https://github.com/AndreasThinks/hermes-wristbound/blob/main/docs/INSTALL.md
      - text: releases
        href: https://github.com/AndreasThinks/hermes-wristbound/releases/latest
      - text: code
        href: https://github.com/AndreasThinks/hermes-wristbound
