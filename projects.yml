# Recent projects, shown in the homepage rail. index.qmd loads this file and includes/projects.lua draws the list.
# Newest first; four or five fit best. Only list projects whose post is published (not draft).
#   path:        the project's post; hovering the project lights this post on the atlas and in the feed
#   status:      live | wip | released
#   links:       text + href; links off the site get ↗, links on it get →
projects:
  - title: AI Tools and the Shape of Commits
    path: posts/ai-tools-and-the-shape-of-commits/index.html
    description: Detecting when developers adopt AI coding tools, and how their commits change after they do.
    status: released
    links:
      - text: paper
        href: papers/ai-productivity/index.html
      - text: code
        href: https://github.com/AndreasThinks/ai-productivity-analysis
      - text: write-up
        href: posts/ai-tools-and-the-shape-of-commits/index.html
